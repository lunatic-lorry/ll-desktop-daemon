name: apply-prebody-deploy-admission

on:
  push:
    branches:
      - hardening/prebody-deploy-admission-20260928
    paths:
      - tools/patch_prebody_deploy_admission.py
      - .github/workflows/apply-prebody-deploy-admission.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/prebody-deploy-admission-20260928
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Apply, format, test focused contract, and remove helpers
        run: |
          python3 tools/patch_prebody_deploy_admission.py
          cargo fmt --all
          cargo test --all-targets deploy_body_limit_bounds_pre_compile_retention
          git diff --check
          git rm tools/patch_prebody_deploy_admission.py .github/workflows/apply-prebody-deploy-admission.yml
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add .cli-flags.toml Cargo.toml Cargo.lock src/main.rs
          git commit -m 'hardening: bound deploy bodies before compilation admission'
          git push origin HEAD:hardening/prebody-deploy-admission-20260928
