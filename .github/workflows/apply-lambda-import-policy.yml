name: apply-lambda-import-policy

on:
  push:
    branches:
      - hardening/lambda-import-admission-20260928

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/lambda-import-admission-20260928
      - name: Wire import admission into daemon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.rs')
          text = path.read_text()

          if 'mod lambda_import_policy;\n' not in text:
              old = 'mod ores_adapter;\nmod ores_receipt;\n'
              new = 'mod lambda_import_policy;\nmod ores_adapter;\nmod ores_receipt;\n'
              if old not in text:
                  raise SystemExit('module insertion anchor not found')
              text = text.replace(old, new, 1)

          if 'Lunatic Lambda import admission failed' not in text:
              start = text.index('fn validate_wasm_module(')
              end = text.index('\n}\n\nfn artifact_path', start) + 2
              function = text[start:end]
              anchor = '    return Ok(());\n}'
              if anchor not in function:
                  raise SystemExit('validate_wasm_module return anchor not found')
              replacement = '''    lambda_import_policy::validate_lunatic_lambda_imports(bytes).map_err(|error| {
              (
                  StatusCode::BAD_REQUEST,
                  format!("Lunatic Lambda import admission failed: {error}"),
              )
          })?;
          return Ok(());
          }'''
              function = function.replace(anchor, replacement, 1)
              text = text[:start] + function + text[end:]

          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/main.rs
          git commit -m 'security: enforce lambda import policy at daemon boundary'
          git push origin HEAD:hardening/lambda-import-admission-20260928
