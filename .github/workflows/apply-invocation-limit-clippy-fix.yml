name: apply-invocation-limit-clippy-fix

on:
  push:
    branches:
      - hardening/prebody-invocation-admission-20260928
    paths:
      - tools/fix_invocation_limit_clippy.py
      - .github/workflows/apply-invocation-limit-clippy-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/prebody-invocation-admission-20260928
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt,clippy
      - name: Apply Clippy-safe regression and remove helpers
        run: |
          python3 tools/fix_invocation_limit_clippy.py
          cargo fmt --all
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets invocation_body_limit_bounds_pre_actor_retention
          git diff --check
          git rm tools/fix_invocation_limit_clippy.py .github/workflows/apply-invocation-limit-clippy-fix.yml
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add src/main.rs
          git commit -m 'test: make invocation admission bounds Clippy-clean'
          git push origin HEAD:hardening/prebody-invocation-admission-20260928
