name: apply-token-boundary
on:
  push:
    branches:
      - hardening/token-file-boundary-20260928
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt,clippy
      - name: Apply exact transform
        run: python3 tools/apply_token_boundary.py
      - name: Format
        run: cargo fmt --all
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Commit source-only result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-token-boundary.yml tools/apply_token_boundary.py
          git add src/main.rs tests/deploy_path_security.rs
          git commit -m 'hardening: fail closed on insecure daemon token files'
          git push
