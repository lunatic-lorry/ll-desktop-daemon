name: apply-prebody-invocation-admission

on:
  push:
    branches:
      - hardening/prebody-invocation-admission-20260928
    paths:
      - tools/patch_prebody_invocation_admission.py
      - .github/workflows/apply-prebody-invocation-admission.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/prebody-invocation-admission-20260928
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Apply, format, test focused contract, and remove helpers
        run: |
          python3 tools/patch_prebody_invocation_admission.py
          cargo fmt --all
          cargo test --all-targets invocation_body_limit_bounds_pre_actor_retention
          git diff --check
          git rm tools/patch_prebody_invocation_admission.py .github/workflows/apply-prebody-invocation-admission.yml
          git config user.name ORESoftware
          git config user.email alex@oresoftware.com
          git add Cargo.toml Cargo.lock src/main.rs
          git commit -m 'hardening: bound invocation bodies before actor admission'
          git push origin HEAD:hardening/prebody-invocation-admission-20260928
