name: generation-contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install declared MSRV
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Generate deterministic lock candidate
        shell: bash
        run: cargo +1.90.0 generate-lockfile
      - name: Preserve lock candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunatic-generation-contract-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 14
      - name: Validate generation lifecycle contract
        shell: bash
        run: cargo +1.90.0 test --locked --test generation_contract
