name: apply-ores-receipt-verification-v2

on:
  push:
    branches:
      - feature/verify-ores-wasm-receipt-v2-20260928

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/verify-ores-wasm-receipt-v2-20260928
      - name: Add strict receipt admission and persisted build evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/verify-ores-wasm-receipt-20260928
          git checkout origin/feature/verify-ores-wasm-receipt-20260928 -- src/ores_receipt.rs
          python3 - <<'PY'
          from pathlib import Path

          receipt_path = Path('src/ores_receipt.rs')
          receipt = receipt_path.read_text()
          receipt = receipt.replace(
              '''    let provenance = raw_adapter.deployment_provenance()?;\n    require(\n        &receipt.source_path,\n        &provenance.source,\n        "receipt source_path",\n    )?;\n    require(\n        &receipt.source_sha256,\n        &provenance.source_sha256,\n        "receipt source_sha256",\n    )?;\n''',
              '''    require(\n        &receipt.source_path,\n        raw_adapter.source(),\n        "receipt source_path",\n    )?;\n    require(\n        &receipt.source_sha256,\n        raw_adapter.source_sha256(),\n        "receipt source_sha256",\n    )?;\n''',
              1,
          )
          receipt = receipt.replace(
              '    fn adapter_bytes() -> Vec<u8> {\n        return serde_json::to_vec(',
              '    fn adapter_bytes() -> Result<Vec<u8>> {\n        return Ok(serde_json::to_vec(',
              1,
          )
          receipt = receipt.replace(
              '        }))\n        .expect("adapter JSON");\n    }\n\n    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Vec<u8> {\n        return serde_json::to_vec(',
              '        })?);\n    }\n\n    fn receipt_bytes(adapter: &[u8], module: &[u8]) -> Result<Vec<u8>> {\n        return Ok(serde_json::to_vec(',
              1,
          )
          receipt = receipt.replace(
              '        }))\n        .expect("receipt JSON");\n    }\n',
              '        })?);\n    }\n',
              1,
          )
          receipt = receipt.replace('        let adapter_bytes = adapter_bytes();\n', '        let adapter_bytes = adapter_bytes()?;\n')
          receipt = receipt.replace('        let receipt = receipt_bytes(&adapter_bytes, module);\n', '        let receipt = receipt_bytes(&adapter_bytes, module)?;\n')
          receipt = receipt.replace('        let receipt = receipt_bytes(&adapter_bytes, b"wasm-module");\n', '        let receipt = receipt_bytes(&adapter_bytes, b"wasm-module")?;\n')
          receipt = receipt.replace('serde_json::from_slice(&adapter_bytes).unwrap();', 'serde_json::from_slice(&adapter_bytes)?;', 1)
          receipt = receipt.replace(
              '        assert!(verify(&structured, &adapter_bytes, &receipt, b"other-module").is_err());\n    }\n}\n',
              '        assert!(verify(&structured, &adapter_bytes, &receipt, b"other-module").is_err());\n        return Ok(());\n    }\n}\n',
              1,
          )
          receipt_path.write_text(receipt)

          path = Path('src/main.rs')
          text = path.read_text()
          if not text.startswith('mod ores_adapter;\nmod ores_receipt;'):
              text = text.replace('mod ores_adapter;\n', 'mod ores_adapter;\nmod ores_receipt;\n', 1)
          text = text.replace(
              '''use ores_adapter::{\n    LL_EXECUTION_BOUNDARY, LL_ISOLATION_MODEL, LL_RUNTIME_CONTRACT, OresLambdaAdapterV1,\n    validate_persisted_provenance,\n};\n''',
              '''use ores_adapter::{\n    LL_EXECUTION_BOUNDARY, LL_ISOLATION_MODEL, LL_RUNTIME_CONTRACT, OresLambdaAdapterV1,\n    validate_persisted_provenance,\n};\nuse ores_receipt::{\n    MAX_ORES_ADAPTER_BYTES, MAX_ORES_RECEIPT_BYTES, OresBuildEvidence,\n    verify as verify_ores_receipt,\n};\n''',
              1,
          )
          text = text.replace(
              '''    #[serde(default)]\n    ores_adapter: Option<OresLambdaAdapterV1>,\n}\n''',
              '''    #[serde(default)]\n    ores_adapter: Option<OresLambdaAdapterV1>,\n    #[serde(default)]\n    ores_adapter_raw_base64: Option<String>,\n    #[serde(default)]\n    ores_receipt_raw_base64: Option<String>,\n}\n''',
              1,
          )
          text = text.replace(
              '    ores_adapter_verified: bool,\n}\n\n#[derive(Debug, Serialize, Deserialize, PartialEq, Eq)]',
              '    ores_adapter_verified: bool,\n    ores_receipt_verified: bool,\n}\n\n#[derive(Debug, Serialize, Deserialize, PartialEq, Eq)]',
              1,
          )
          text = text.replace(
              '''    #[serde(default)]\n    ores_source_sha256: Option<String>,\n}\n''',
              '''    #[serde(default)]\n    ores_source_sha256: Option<String>,\n    #[serde(default)]\n    ores_build_evidence: Option<OresBuildEvidence>,\n}\n''',
              1,
          )

          marker = '    validate_wasm_module(&bytes)?;\n'
          receipt_admission = '''    let ores_build_evidence = match (\n        request.ores_adapter.as_ref(),\n        request.ores_adapter_raw_base64.as_deref(),\n        request.ores_receipt_raw_base64.as_deref(),\n    ) {\n        (_, None, None) => None,\n        (Some(adapter), Some(raw_adapter), Some(raw_receipt)) => {\n            if raw_adapter.len() > MAX_ORES_ADAPTER_BYTES.saturating_mul(2)\n                || raw_receipt.len() > MAX_ORES_RECEIPT_BYTES.saturating_mul(2)\n            {\n                return Err((\n                    StatusCode::PAYLOAD_TOO_LARGE,\n                    "ORES receipt evidence exceeds admitted encoded size".to_owned(),\n                ));\n            }\n            let raw_adapter = BASE64.decode(raw_adapter.as_bytes()).map_err(|_| {\n                (\n                    StatusCode::BAD_REQUEST,\n                    "ores_adapter_raw_base64 is not valid base64".to_owned(),\n                )\n            })?;\n            let raw_receipt = BASE64.decode(raw_receipt.as_bytes()).map_err(|_| {\n                (\n                    StatusCode::BAD_REQUEST,\n                    "ores_receipt_raw_base64 is not valid base64".to_owned(),\n                )\n            })?;\n            Some(\n                verify_ores_receipt(adapter, &raw_adapter, &raw_receipt, &bytes).map_err(\n                    |error| {\n                        (\n                            StatusCode::BAD_REQUEST,\n                            format!("ORES receipt verification failed: {error}"),\n                        )\n                    },\n                )?,\n            )\n        }\n        _ => {\n            return Err((\n                StatusCode::BAD_REQUEST,\n                "ORES receipt evidence requires structured adapter, exact raw adapter, and exact raw receipt together".to_owned(),\n            ));\n        }\n    };\n    validate_wasm_module(&bytes)?;\n'''
          if text.count(marker) != 1:
              raise SystemExit('WASM validation insertion point drifted')
          text = text.replace(marker, receipt_admission, 1)
          text = text.replace(
              '''        ores_source,\n        ores_source_sha256,\n    };\n''',
              '''        ores_source,\n        ores_source_sha256,\n        ores_build_evidence,\n    };\n''',
              1,
          )
          text = text.replace(
              '''        module_bytes: bytes.len(),\n        ores_adapter_verified,\n    }));\n''',
              '''        module_bytes: bytes.len(),\n        ores_adapter_verified,\n        ores_receipt_verified: manifest.ores_build_evidence.is_some(),\n    }));\n''',
              1,
          )

          old_validator = '''fn validate_manifest_ores_provenance(manifest: &DeploymentManifest) -> Result<()> {\n    match (\n        manifest.ores_adapter_verified,\n        manifest.ores_adapter_sha256.as_deref(),\n        manifest.ores_source.as_deref(),\n        manifest.ores_source_sha256.as_deref(),\n    ) {\n        (false, None, None, None) => return Ok(()),\n        (true, Some(adapter_sha256), source, source_sha256) => {\n            return validate_persisted_provenance(adapter_sha256, source, source_sha256);\n        }\n        _ => bail!("deployment manifest contains inconsistent ORES provenance evidence"),\n    }\n}\n'''
          new_validator = '''fn validate_manifest_ores_provenance(manifest: &DeploymentManifest) -> Result<()> {\n    match (\n        manifest.ores_adapter_verified,\n        manifest.ores_adapter_sha256.as_deref(),\n        manifest.ores_source.as_deref(),\n        manifest.ores_source_sha256.as_deref(),\n    ) {\n        (false, None, None, None) => {}\n        (true, Some(adapter_sha256), source, source_sha256) => {\n            validate_persisted_provenance(adapter_sha256, source, source_sha256)?;\n        }\n        _ => bail!("deployment manifest contains inconsistent ORES provenance evidence"),\n    }\n    if let Some(evidence) = manifest.ores_build_evidence.as_ref() {\n        if !manifest.ores_adapter_verified\n            || manifest.ores_source.is_none()\n            || manifest.ores_source_sha256.is_none()\n        {\n            bail!("ORES build evidence requires fully-bound adapter source provenance");\n        }\n        evidence.validate()?;\n        if evidence.artifact_sha256 != manifest.module_sha256 {\n            bail!("ORES build evidence artifact digest does not match deployment module");\n        }\n    }\n    return Ok(());\n}\n'''
          if text.count(old_validator) != 1:
              raise SystemExit('manifest provenance validator drifted')
          text = text.replace(old_validator, new_validator, 1)

          # Existing manifest fixtures need the optional field explicitly when constructed in Rust.
          text = text.replace('            ores_source_sha256: None,\n', '            ores_source_sha256: None,\n            ores_build_evidence: None,\n')
          text = text.replace('            ores_source_sha256: Some("b".repeat(64)),\n', '            ores_source_sha256: Some("b".repeat(64)),\n            ores_build_evidence: None,\n')
          text = text.replace('            ores_source_sha256: Some("c".repeat(64));', '            ores_source_sha256: Some("c".repeat(64));')

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git add src/main.rs src/ores_receipt.rs
          git rm .github/workflows/apply-ores-receipt-verification-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'hardening: verify ORES WASM artifact receipts at Lunatic deploy admission'
          git push origin HEAD:feature/verify-ores-wasm-receipt-v2-20260928
