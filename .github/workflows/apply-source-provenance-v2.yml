name: apply-source-provenance-v2

on:
  push:
    branches:
      - hardening/bind-ores-source-provenance-v2-20260928

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/bind-ores-source-provenance-v2-20260928
      - name: Apply provenance extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          adapter_path = Path('src/ores_adapter.rs')
          adapter = adapter_path.read_text()
          adapter = replace_once(
              adapter,
              'use serde::{Deserialize, Serialize};\nuse std::path::{Component, Path};\n',
              'use serde::{Deserialize, Serialize};\nuse sha2::{Digest, Sha256};\nuse std::path::{Component, Path};\n',
              'sha2 import',
          )
          adapter = replace_once(
              adapter,
              '        validate_sha256(&self.source_sha256)?;\n        return Ok(());\n    }\n}\n\nfn require_eq',
              '''        validate_sha256(&self.source_sha256)?;\n        return Ok(());\n    }\n\n    pub fn semantic_sha256(&self) -> Result<String> {\n        let bytes = serde_json::to_vec(self)?;\n        return Ok(format!("{:x}", Sha256::digest(bytes)));\n    }\n\n    pub fn source(&self) -> &str {\n        return &self.source;\n    }\n\n    pub fn source_sha256(&self) -> &str {\n        return &self.source_sha256;\n    }\n}\n\npub fn validate_persisted_provenance(\n    adapter_sha256: &str,\n    source: Option<&str>,\n    source_sha256: Option<&str>,\n) -> Result<()> {\n    validate_sha256(adapter_sha256)?;\n    match (source, source_sha256) {\n        (None, None) => {} // legacy manifest emitted before source provenance was persisted\n        (Some(source), Some(source_sha256)) => {\n            validate_source_path(source)?;\n            validate_sha256(source_sha256)?;\n        }\n        _ => bail!("ORES persisted source provenance must be complete or absent"),\n    }\n    return Ok(());\n}\n\nfn require_eq''',
              'adapter provenance methods',
          )
          adapter = replace_once(
              adapter,
              '    #[test]\n    fn reuse_and_capability_widening_fail_closed() {',
              '''    #[test]\n    fn persisted_provenance_accepts_legacy_or_complete_evidence() -> Result<()> {\n        let adapter = valid_adapter();\n        let adapter_sha256 = adapter.semantic_sha256()?;\n        validate_persisted_provenance(&adapter_sha256, None, None)?;\n        validate_persisted_provenance(\n            &adapter_sha256,\n            Some(adapter.source()),\n            Some(adapter.source_sha256()),\n        )?;\n        assert!(\n            validate_persisted_provenance(&adapter_sha256, Some(adapter.source()), None).is_err()\n        );\n        return Ok(());\n    }\n\n    #[test]\n    fn reuse_and_capability_widening_fail_closed() {''',
              'adapter provenance test',
          )
          adapter_path.write_text(adapter)

          main_path = Path('src/main.rs')
          main = main_path.read_text()
          main = replace_once(
              main,
              'use ores_adapter::{\n    LL_EXECUTION_BOUNDARY, LL_ISOLATION_MODEL, LL_RUNTIME_CONTRACT, OresLambdaAdapterV1,\n};',
              'use ores_adapter::{\n    LL_EXECUTION_BOUNDARY, LL_ISOLATION_MODEL, LL_RUNTIME_CONTRACT, OresLambdaAdapterV1,\n    validate_persisted_provenance,\n};',
              'main adapter import',
          )
          main = replace_once(
              main,
              '    ores_adapter_verified: bool,\n    ores_adapter_sha256: Option<String>,\n}',
              '    ores_adapter_verified: bool,\n    ores_adapter_sha256: Option<String>,\n    #[serde(default)]\n    ores_source: Option<String>,\n    #[serde(default)]\n    ores_source_sha256: Option<String>,\n}',
              'manifest provenance fields',
          )
          old_match = '''    let (ores_adapter_verified, ores_adapter_sha256) = match request.ores_adapter.as_ref() {\n        Some(adapter) => {\n            adapter.validate().map_err(|error| {\n                (\n                    StatusCode::BAD_REQUEST,\n                    format!("ORES adapter validation failed: {error}"),\n                )\n            })?;\n            let canonical = serde_json::to_vec(adapter).map_err(internal_error)?;\n            (true, Some(format!("{:x}", Sha256::digest(&canonical))))\n        }\n        None => (false, None),\n    };'''
          new_match = '''    let (\n        ores_adapter_verified,\n        ores_adapter_sha256,\n        ores_source,\n        ores_source_sha256,\n    ) = match request.ores_adapter.as_ref() {\n        Some(adapter) => {\n            adapter.validate().map_err(|error| {\n                (\n                    StatusCode::BAD_REQUEST,\n                    format!("ORES adapter validation failed: {error}"),\n                )\n            })?;\n            let adapter_sha256 = adapter.semantic_sha256().map_err(internal_error)?;\n            (\n                true,\n                Some(adapter_sha256),\n                Some(adapter.source().to_owned()),\n                Some(adapter.source_sha256().to_owned()),\n            )\n        }\n        None => (false, None, None, None),\n    };'''
          main = replace_once(main, old_match, new_match, 'deploy provenance admission')
          main = replace_once(
              main,
              '        ores_adapter_verified,\n        ores_adapter_sha256,\n    };',
              '        ores_adapter_verified,\n        ores_adapter_sha256,\n        ores_source,\n        ores_source_sha256,\n    };',
              'manifest provenance assignment',
          )
          main = main.replace(
              '            ores_adapter_sha256: None,\n',
              '            ores_adapter_sha256: None,\n            ores_source: None,\n            ores_source_sha256: None,\n',
          )
          main = main.replace(
              '            ores_adapter_sha256: Some("a".repeat(64)),\n',
              '            ores_adapter_sha256: Some("a".repeat(64)),\n            ores_source: Some("src/routes/echo/lambda.rs".to_owned()),\n            ores_source_sha256: Some("b".repeat(64)),\n',
          )
          if main.count('ores_source: None,') < 1:
              raise SystemExit('expected at least one raw manifest test fixture')
          if main.count('ores_source: Some(') < 1:
              raise SystemExit('expected at least one ORES manifest test fixture')
          main = replace_once(
              main,
              'async fn verify_deployment(\n',
              '''fn validate_manifest_ores_provenance(manifest: &DeploymentManifest) -> Result<()> {\n    match (\n        manifest.ores_adapter_verified,\n        manifest.ores_adapter_sha256.as_deref(),\n        manifest.ores_source.as_deref(),\n        manifest.ores_source_sha256.as_deref(),\n    ) {\n        (false, None, None, None) => return Ok(()),\n        (true, Some(adapter_sha256), source, source_sha256) => {\n            return validate_persisted_provenance(adapter_sha256, source, source_sha256);\n        }\n        _ => bail!("deployment manifest contains inconsistent ORES provenance evidence"),\n    }\n}\n\nasync fn verify_deployment(\n''',
              'manifest provenance validator',
          )
          main = replace_once(
              main,
              '        || manifest.isolation_model != LL_ISOLATION_MODEL\n        || manifest.ores_adapter_verified != manifest.ores_adapter_sha256.is_some()\n    {',
              '        || manifest.isolation_model != LL_ISOLATION_MODEL\n    {',
              'remove legacy boolean-only provenance check',
          )
          main = replace_once(
              main,
              '    let module = tokio::fs::read(&module_path).await?;\n',
              '    validate_manifest_ores_provenance(&manifest)?;\n\n    let module = tokio::fs::read(&module_path).await?;\n',
              'invoke provenance validator',
          )
          main = replace_once(
              main,
              '    #[tokio::test]\n    async fn deployment_manifest_requires_consistent_adapter_evidence() -> Result<()> {',
              '''    #[test]\n    fn manifest_provenance_accepts_legacy_and_complete_evidence() -> Result<()> {\n        let mut manifest = DeploymentManifest {\n            schema_version: "lunatic-lorry.deployment/v1".to_owned(),\n            tenant_id: "tenant-a".to_owned(),\n            deployment_id: "deploy-a".to_owned(),\n            module_sha256: "a".repeat(64),\n            module_bytes: 8,\n            runtime_contract: LL_RUNTIME_CONTRACT.to_owned(),\n            execution_boundary: LL_EXECUTION_BOUNDARY.to_owned(),\n            isolation_model: LL_ISOLATION_MODEL.to_owned(),\n            ores_adapter_verified: true,\n            ores_adapter_sha256: Some("b".repeat(64)),\n            ores_source: None,\n            ores_source_sha256: None,\n        };\n        validate_manifest_ores_provenance(&manifest)?;\n\n        manifest.ores_source = Some("src/routes/echo/lambda.rs".to_owned());\n        manifest.ores_source_sha256 = Some("c".repeat(64));\n        validate_manifest_ores_provenance(&manifest)?;\n\n        manifest.ores_source_sha256 = None;\n        assert!(validate_manifest_ores_provenance(&manifest).is_err());\n        return Ok(());\n    }\n\n    #[tokio::test]\n    async fn deployment_manifest_requires_consistent_adapter_evidence() -> Result<()> {''',
              'manifest provenance compatibility test',
          )
          main_path.write_text(main)
          PY
          cargo fmt --all
          cargo test --all-targets
          cargo clippy --all-targets -- -D warnings
          git add src/main.rs src/ores_adapter.rs
          git rm .github/workflows/apply-source-provenance-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'hardening: bind Lunatic deployments to ORES source provenance'
          git push origin HEAD:hardening/bind-ores-source-provenance-v2-20260928
